[package]
name = "microsandbox-network"
description = "Networking types and smoltcp engine for the microsandbox project."
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[lib]
path = "lib/lib.rs"

[features]
default = ["engine"]
# Host network control protocol: the runtime client and the embedding host's
# listener. Needs no packet engine, so the SDK can bind the host side alone.
control = ["dep:serde_json", "dep:tokio"]
engine = [
    "control",
    "dep:base64",
    "dep:bytes",
    "dep:crossbeam-queue",
    "dep:futures",
    "dep:hickory-net",
    "dep:httlib-hpack",
    "dep:httparse",
    "dep:libc",
    "dep:lru",
    "dep:msb_krun",
    "dep:msb_krun_utils",
    "dep:parking_lot",
    "dep:pem",
    "dep:percent-encoding",
    "dep:rcgen",
    "dep:resolv-conf",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
    "dep:socket2",
    "dep:smoltcp",
    "dep:time",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tokio-socks",
    "dep:windows-sys",
]

[dependencies]
base64 = { version = "0.22", optional = true }
bytes = { workspace = true, optional = true }
crossbeam-queue = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# tls-ring unlocks `hickory_net::tls::tls_client_connect` for the
# upstream DoT client. The workspace already uses rustls with the ring
# crypto provider, so no new dependency is introduced.
hickory-net = { workspace = true, features = ["tls-ring"], optional = true }
hickory-proto = { workspace = true }
httlib-hpack = { workspace = true, optional = true }
httparse = { version = "1", optional = true }
ipnetwork = { workspace = true }
libc = { workspace = true, optional = true }
lru = { workspace = true, optional = true }
microsandbox-protocol.workspace = true
microsandbox-types.workspace = true
microsandbox-utils.workspace = true
msb_krun = { workspace = true, features = ["net"], optional = true }
msb_krun_utils = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
pem = { version = "3", optional = true }
percent-encoding = { version = "2", optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
# Used for the `SO_LINGER(0)` (RST-on-drop) trick on rejected inbound
# connections in `publisher.rs`. tokio's `TcpStream::set_linger` is
# deprecated; `socket2::SockRef::from(&stream)` is the supported path.
socket2 = { workspace = true, optional = true }
smoltcp = { workspace = true, optional = true, features = [
    "alloc",
    "async",
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-dns",
    "socket-icmp",
    "socket-tcp",
    "socket-udp",
] }
thiserror = { workspace = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tokio-socks = { workspace = true, optional = true }
tracing.workspace = true
zeroize = { workspace = true }

# Linux resolves host-default DNS through the nameservers in /etc/resolv.conf.
[target.'cfg(target_os = "linux")'.dependencies]
resolv-conf = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_Dns", "Win32_System_LibraryLoader"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
