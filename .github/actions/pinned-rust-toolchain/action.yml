name: Install pinned Rust toolchain
description: Use the release toolchain from rust-toolchain.toml in downstream CI.

inputs:
  components:
    description: Additional Rust components to install.
    required: false
    default: ""
  targets:
    description: Additional Rust targets to install.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read the release toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml | tr -d '\r')
        if [[ ! "${toolchain}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::rust-toolchain.toml must pin an exact Rust release"
          exit 1
        fi
        echo "version=${toolchain}" >> "${GITHUB_OUTPUT}"

    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      with:
        toolchain: ${{ steps.toolchain.outputs.version }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Report the active toolchain
      shell: bash
      run: |
        rustup show active-toolchain
        rustc --version
        cargo --version
        cargo clippy --version
